name: Prototype CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: bash -n scripts/test-call-mac.sh
  rust-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve upstream yanked nostr-sdk pin explicitly
        run: cargo update --manifest-path vector-bot/Cargo.toml -p nostr-sdk --precise 0.45.1
      - run: cargo check --manifest-path vector-bot/Cargo.toml --locked

  native-stage-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve upstream yanked nostr-sdk pin explicitly
        run: cargo update --manifest-path native-stage-bot/Cargo.toml -p nostr-sdk --precise 0.45.1
      - name: Compile native stage adapter against Vector SDK 0.11.0
        run: cargo check --manifest-path native-stage-bot/Cargo.toml --locked
