name: Prototype CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: bash -n scripts/test-call-mac.sh
  rust-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path vector-bot/Cargo.toml

  native-stage-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Vector native stage controller against v0.5.1 SDK source
        run: cargo check --manifest-path native-stage-bot/Cargo.toml
      - name: Test stage lifecycle state machine
        run: cargo test --manifest-path native-stage-bot/Cargo.toml
